name: 部署 PDF 编辑器

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: uyuu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run:  npm install

      - name: 构建网站
        run: npm run build

      - name: 上传网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: uyuu/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
